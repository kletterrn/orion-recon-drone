name: Source and resource integrity
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Identify required LFS objects
        id: lfs
        shell: bash
        run: echo "key=$(git lfs ls-files -l | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: orion-lfs-${{ steps.lfs.outputs.key }}
          restore-keys: orion-lfs-
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python Tools/release.py check
